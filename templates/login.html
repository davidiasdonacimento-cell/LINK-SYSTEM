<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área do dono • LINK SYSTEM</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="shell admin-shell"><a class="back" href="/">← Perfil público</a><div class="brand-mark">LS</div><p class="eyebrow">ÁREA PRIVADA</p><h1>Entrar como dono</h1><p class="subtitle">Acesse para gerenciar o perfil e todos os links.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="panel"><label>Login</label><input name="username" value="{{ owner_name }}" autocomplete="username" required><label>Senha</label><input name="password" type="password" autocomplete="current-password" required><button type="submit">Entrar no painel</button></form></main></body></html>
