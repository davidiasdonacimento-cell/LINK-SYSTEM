<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#160d2c"><title>{{ profile_title }}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="shell public"><div class="brand-mark">LS</div><p class="eyebrow">SEU UNIVERSO DIGITAL</p><h1>{{ profile_title }}</h1><p class="subtitle">{{ profile_description }}</p>
<section class="links" aria-label="Links do perfil">{% for link in links %}<a class="link-card" href="{{ link.url }}" target="_blank" rel="noopener noreferrer"><span class="link-icon">↗</span><span>{{ link.title }}</span><span class="arrow">↗</span></a>{% else %}<div class="empty">Os links aparecerão aqui em breve.</div>{% endfor %}</section>
<footer>LINK SYSTEM</footer></main></body></html>
